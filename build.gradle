plugins {
    id 'scala'
    id 'idea'
    id 'application'
}

tasks.register('printRuntimeClasspath') {
    doLast {
        println sourceSets.main.runtimeClasspath.asPath
    }
}

application {
    mainClass.set('chip.Chip8App')
}

tasks.register('runDebugger', JavaExec) {
    group = 'application'
    description = 'Runs the CHIP-8 emulator with the debugger interface.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('chip.Chip8Debugger')
}

ext {
    scalaMajorVersion = '3.3'
    scalaVersion = "${scalaMajorVersion}.8"
}


repositories {

    mavenCentral()

    maven {
        url = "https://jogamp.org/deployment/maven/"
    }

    maven {
        url = "https://jitpack.io"
    }
}

sourceSets.main.scala.srcDirs = ['src']
sourceSets.main.scala.exclude 'test/**'

dependencies {
    runtimeOnly("org.scala-lang:scala3-compiler_3:${scalaVersion}")

    implementation 'net.compartmental.code:minim:2.2.2'
    
    implementation("org.processing:core:4.4.4")
    implementation("org.jogamp.gluegen:gluegen-rt-main:2.5.0")
    // https://mvnrepository.com/artifact/org.jogamp.gluegen/gluegen-rt
    implementation("org.jogamp.gluegen:gluegen-rt:2.5.0")
    implementation("org.scala-lang:scala3-library_3:${scalaVersion}")
    
    testImplementation('junit:junit:4.13.2')
    testImplementation("org.scalatest:scalatest_3:3.2.19")
    testImplementation("org.scalatestplus:junit-4-13_3:3.2.19.0")
}

task zip(type: Zip) {
    group = "prepareZipForSubmit"
    description = "Zip your code for submission to Codegrade"

    // To make sure you can always run this task
    outputs.upToDateWhen { false }
    dependsOn assemble
    dependsOn testClasses
    from projectDir
    include 'build.gradle'
    include 'gradlew'
    include 'gradlew.bat'
    include 'repl.bat'
    include 'repl.sh'
    include 'README.md'
    include 'gradle/wrapper/**'
    include 'src/**'
    include 'ROMs/**'
    include 'demos/**'

    archiveFileName = 'chip.zip'
    destinationDirectory = layout.buildDirectory.dir("$projectDir")
}
